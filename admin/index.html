<!DOCTYPE html>
<html lang="en" class="admin-html" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>Admin — Mobile Sports Hall of Fame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="icon" href="../assets/favicon.ico" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <section class="admin-gate" id="login-gate">
      <img class="admin-logo" src="../assets/logo.png?v=6" alt="Mobile Sports Hall of Fame" width="120" height="126" />
      <h1>Content admin</h1>
      <p>Edit news, the featured event, partners, sponsors, and the board roster. Changes appear on the public site about a minute after you save.</p>
      <form id="login-form">
        <div class="admin-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="admin-actions">
          <button class="admin-btn" type="submit">Sign in</button>
        </div>
        <p class="admin-status" id="login-status" role="status"></p>
      </form>
    </section>

    <section class="admin-panel" id="app" hidden>
      <header class="admin-header">
        <div class="admin-header-brand">
          <img class="admin-logo admin-logo--header" src="../assets/logo.png?v=6" alt="Mobile Sports Hall of Fame" width="56" height="59" />
          <div>
            <h1>Content admin</h1>
            <p>Mobile Sports Hall of Fame</p>
          </div>
        </div>
        <div class="admin-actions">
          <button type="button" class="admin-btn" id="btn-save">Save</button>
          <button type="button" class="admin-btn admin-btn--ghost" id="btn-logout">Sign out</button>
        </div>
      </header>

      <nav class="admin-tabs" id="tabs" aria-label="Content sections">
        <button type="button" class="admin-tab is-active" data-tab="news">News</button>
        <button type="button" class="admin-tab" data-tab="event">Featured event</button>
        <button type="button" class="admin-tab" data-tab="partners">Partners</button>
        <button type="button" class="admin-tab" data-tab="sponsors">Sponsors</button>
        <button type="button" class="admin-tab" data-tab="board">Board</button>
      </nav>

      <p class="admin-status" id="app-status" role="status"></p>

      <div id="tab-panels">
        <!-- filled by admin.js -->
      </div>
    </section>
  </div>

  <div class="admin-modal-backdrop" id="token-modal" hidden>
    <div class="admin-modal" role="dialog" aria-labelledby="token-title">
      <h2 id="token-title">Publish key</h2>
      <p>Paste the publish key you were given. It’s only kept in this browser tab.</p>
      <form id="token-form">
        <div class="admin-field">
          <label for="token-input">Publish key</label>
          <input id="token-input" type="password" autocomplete="off" required />
        </div>
        <div class="admin-actions">
          <button type="submit" class="admin-btn">Continue</button>
          <button type="button" class="admin-btn admin-btn--ghost" id="token-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
